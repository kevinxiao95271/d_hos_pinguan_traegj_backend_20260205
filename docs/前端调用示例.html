<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史数据查询 - 前端测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        input, select {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        .info {
            background-color: #e7f3fe;
            padding: 10px;
            border-left: 4px solid #2196F3;
            margin: 10px 0;
        }
        .error {
            background-color: #ffe7e7;
            padding: 10px;
            border-left: 4px solid #f44336;
            margin: 10px 0;
        }
        .success {
            background-color: #e7ffe7;
            padding: 10px;
            border-left: 4px solid #4CAF50;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>历史数据查询接口 - 前端测试页面</h1>
    
    <div class="section">
        <h2>1. 登录获取 Token</h2>
        <button onclick="login()">登录（组委会管理员）</button>
        <div id="loginResult"></div>
    </div>
    
    <div class="section">
        <h2>2. 查询历史数据</h2>
        <div>
            <label>地区: <input type="text" id="region" placeholder="如：杭州"></label>
            <label>组别: 
                <select id="competitionGroup">
                    <option value="">全部</option>
                    <option value="综合组">综合组</option>
                    <option value="基层组">基层组</option>
                    <option value="进阶组">进阶组</option>
                </select>
            </label>
            <label>年份: 
                <select id="year">
                    <option value="">全部</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                </select>
            </label>
            <label>医院: <input type="text" id="institutionName" placeholder="如：人民医院"></label>
            <br>
            <label>页码: <input type="number" id="page" value="0" min="0"></label>
            <label>每页: <input type="number" id="size" value="10" min="1" max="100"></label>
            <button onclick="queryData()">查询</button>
            <button onclick="clearFilters()">清空筛选</button>
        </div>
        <div id="queryResult"></div>
    </div>
    
    <div class="section">
        <h2>3. 数据列表</h2>
        <div id="dataTable"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:6031/api';
        let token = null;
        
        // 登录
        async function login() {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = '<div class="info">正在登录...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phone: '13800000041',
                        name: 'CommitteeAdmin A',
                        role: 'COMMITTEE_ADMIN'
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    token = result.data.token;
                    resultDiv.innerHTML = `
                        <div class="success">
                            <strong>✓ 登录成功</strong><br>
                            用户: ${result.data.name}<br>
                            角色: ${result.data.role}<br>
                            Token: ${token.substring(0, 50)}...
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error">✗ 登录失败: ${result.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ 请求失败: ${error.message}</div>`;
            }
        }
        
        // 查询数据
        async function queryData() {
            if (!token) {
                alert('请先登录！');
                return;
            }
            
            const resultDiv = document.getElementById('queryResult');
            const tableDiv = document.getElementById('dataTable');
            resultDiv.innerHTML = '<div class="info">正在查询...</div>';
            
            // 构建查询参数
            const params = new URLSearchParams();
            const region = document.getElementById('region').value;
            const competitionGroup = document.getElementById('competitionGroup').value;
            const institutionName = document.getElementById('institutionName').value;
            const year = document.getElementById('year').value;
            const page = document.getElementById('page').value;
            const size = document.getElementById('size').value;
            
            if (region) params.append('region', region);
            if (competitionGroup) params.append('competitionGroup', competitionGroup);
            if (institutionName) params.append('institutionName', institutionName);
            if (year) params.append('year', year);
            params.append('page', page);
            params.append('size', size);
            
            try {
                const response = await fetch(`${API_BASE}/historical-data?${params}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    resultDiv.innerHTML = `
                        <div class="success">
                            <strong>✓ 查询成功</strong><br>
                            总记录数: ${data.totalElements}<br>
                            总页数: ${data.totalPages}<br>
                            当前页: ${data.number + 1} / ${data.totalPages}<br>
                            当前页记录数: ${data.numberOfElements}
                        </div>
                    `;
                    
                    // 显示数据表格
                    if (data.content && data.content.length > 0) {
                        let tableHTML = `
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>项目名称</th>
                                        <th>医院</th>
                                        <th>组别</th>
                                        <th>地址</th>
                                        <th>状态</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
                        
                        data.content.forEach(item => {
                            tableHTML += `
                                <tr>
                                    <td>${item.id}</td>
                                    <td>${item.projectName}</td>
                                    <td>${item.institutionName}</td>
                                    <td>${item.competitionGroup}</td>
                                    <td>${item.institutionAddress}</td>
                                    <td>${item.dataStatus}</td>
                                </tr>
                            `;
                        });
                        
                        tableHTML += '</tbody></table>';
                        tableDiv.innerHTML = tableHTML;
                    } else {
                        tableDiv.innerHTML = '<div class="info">没有找到数据</div>';
                    }
                } else {
                    resultDiv.innerHTML = `<div class="error">✗ 查询失败: ${result.message}</div>`;
                    tableDiv.innerHTML = '';
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">✗ 请求失败: ${error.message}</div>`;
                tableDiv.innerHTML = '';
            }
        }
        
        // 清空筛选
        function clearFilters() {
            document.getElementById('region').value = '';
            document.getElementById('competitionGroup').value = '';
            document.getElementById('institutionName').value = '';
            document.getElementById('year').value = '';
            document.getElementById('page').value = '0';
            document.getElementById('size').value = '10';
        }
        
        // 页面加载时自动登录
        window.onload = function() {
            login();
        };
    </script>
</body>
</html>
