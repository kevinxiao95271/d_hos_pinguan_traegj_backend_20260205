<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报名统计图表示例</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-card:nth-child(2) {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .stat-card:nth-child(3) {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .stat-card:nth-child(4) {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 20px;
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .chart {
            width: 100%;
            height: 400px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .login-section {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .login-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .login-form input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .login-form button {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .login-form button:hover {
            background: #5568d3;
        }
        
        .status {
            margin-top: 10px;
            font-size: 14px;
        }
        
        .status.success {
            color: #28a745;
        }
        
        .status.error {
            color: #dc3545;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 报名统计数据可视化</h1>
        <p class="subtitle">实时展示赛事报名统计数据</p>
        
        <!-- 登录区域 -->
        <div class="login-section">
            <h3>🔐 登录</h3>
            <div class="login-form">
                <input type="text" id="phone" placeholder="手机号" value="13800000041">
                <input type="text" id="name" placeholder="姓名" value="CommitteeAdmin A">
                <select id="role">
                    <option value="COMMITTEE_ADMIN">COMMITTEE_ADMIN</option>
                    <option value="OPS">OPS</option>
                    <option value="REVIEWER">REVIEWER</option>
                </select>
                <button onclick="login()">登录</button>
            </div>
            <div id="loginStatus" class="status"></div>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-grid" id="statsCards">
            <div class="stat-card">
                <div class="stat-label">报名总数</div>
                <div class="stat-value" id="totalRegistrations">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">品管工具种类</div>
                <div class="stat-value" id="toolTypes">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">评委总数</div>
                <div class="stat-value" id="reviewers">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">未评分任务</div>
                <div class="stat-value" id="unscored">-</div>
            </div>
        </div>
        
        <!-- 图表区域 -->
        <div class="charts-grid">
            <!-- 地区分布饼图 -->
            <div class="chart-container">
                <div class="chart-title">📍 地区分布</div>
                <div id="regionChart" class="chart"></div>
            </div>
            
            <!-- 主题类型分布饼图 -->
            <div class="chart-container">
                <div class="chart-title">📋 主题类型分布</div>
                <div id="subjectChart" class="chart"></div>
            </div>
            
            <!-- 评分雷达图 -->
            <div class="chart-container full-width">
                <div class="chart-title">⭐ 平均评分分析</div>
                <div id="scoreChart" class="chart"></div>
            </div>
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            加载中...
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:6031';
        let token = null;
        
        // 登录
        async function login() {
            const phone = document.getElementById('phone').value;
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;
            const statusEl = document.getElementById('loginStatus');
            
            try {
                const response = await fetch(`${BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ phone, name, role })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    token = result.data.token;
                    statusEl.textContent = `✅ 登录成功: ${result.data.name} (${result.data.role})`;
                    statusEl.className = 'status success';
                    
                    // 加载统计数据
                    loadStats();
                } else {
                    statusEl.textContent = `❌ 登录失败: ${result.message}`;
                    statusEl.className = 'status error';
                }
            } catch (error) {
                statusEl.textContent = `❌ 登录失败: ${error.message}`;
                statusEl.className = 'status error';
            }
        }
        
        // 加载统计数据
        async function loadStats() {
            if (!token) {
                alert('请先登录');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            
            try {
                const response = await fetch(`${BASE_URL}/api/admin/stats/summary`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    
                    // 更新统计卡片
                    document.getElementById('totalRegistrations').textContent = data.registrationCount || 0;
                    document.getElementById('toolTypes').textContent = data.toolTypeCount || 0;
                    document.getElementById('reviewers').textContent = data.reviewerCount || 0;
                    document.getElementById('unscored').textContent = data.bookReviewUnscoredCount || 0;
                    
                    // 绘制图表
                    drawRegionChart(data.regionCounts);
                    drawSubjectChart(data.subjectTypeCounts);
                    drawScoreChart(data);
                } else {
                    alert(`获取数据失败: ${result.message}`);
                }
            } catch (error) {
                alert(`获取数据失败: ${error.message}`);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        // 绘制地区分布饼图
        function drawRegionChart(regionCounts) {
            const chart = echarts.init(document.getElementById('regionChart'));
            
            if (!regionCounts || Object.keys(regionCounts).length === 0) {
                chart.setOption({
                    title: {
                        text: '暂无数据',
                        left: 'center',
                        top: 'center'
                    }
                });
                return;
            }
            
            // 转换数据并排序
            const data = Object.entries(regionCounts)
                .map(([name, value]) => ({ name, value }))
                .sort((a, b) => b.value - a.value);
            
            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{a} <br/>{b}: {c} ({d}%)'
                },
                legend: {
                    orient: 'vertical',
                    left: 'left',
                    top: 'middle',
                    data: data.map(item => item.name)
                },
                series: [
                    {
                        name: '报名数',
                        type: 'pie',
                        radius: '60%',
                        center: ['60%', '50%'],
                        data: data,
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        },
                        label: {
                            formatter: '{b}\n{c} ({d}%)'
                        }
                    }
                ]
            };
            
            chart.setOption(option);
        }
        
        // 绘制主题类型分布饼图
        function drawSubjectChart(subjectTypeCounts) {
            const chart = echarts.init(document.getElementById('subjectChart'));
            
            if (!subjectTypeCounts || Object.keys(subjectTypeCounts).length === 0) {
                chart.setOption({
                    title: {
                        text: '暂无数据',
                        left: 'center',
                        top: 'center'
                    }
                });
                return;
            }
            
            const data = Object.entries(subjectTypeCounts)
                .map(([name, value]) => ({ name, value }))
                .sort((a, b) => b.value - a.value);
            
            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{a} <br/>{b}: {c} ({d}%)'
                },
                legend: {
                    orient: 'vertical',
                    left: 'left',
                    top: 'middle',
                    data: data.map(item => item.name)
                },
                series: [
                    {
                        name: '报名数',
                        type: 'pie',
                        radius: ['40%', '70%'],
                        center: ['60%', '50%'],
                        avoidLabelOverlap: false,
                        data: data,
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        },
                        label: {
                            show: true,
                            formatter: '{b}\n{d}%'
                        }
                    }
                ]
            };
            
            chart.setOption(option);
        }
        
        // 绘制评分雷达图
        function drawScoreChart(data) {
            const chart = echarts.init(document.getElementById('scoreChart'));
            
            const option = {
                tooltip: {
                    trigger: 'axis'
                },
                radar: {
                    indicator: [
                        { name: '计划 (Plan)', max: 20 },
                        { name: '问题 (Problem)', max: 20 },
                        { name: '行动 (Action)', max: 20 },
                        { name: '成功 (Success)', max: 20 },
                        { name: '评审 (Review)', max: 20 },
                        { name: '操作 (Operation)', max: 20 },
                        { name: '展示 (Presentation)', max: 20 }
                    ],
                    center: ['50%', '55%'],
                    radius: '60%'
                },
                series: [
                    {
                        name: '平均分',
                        type: 'radar',
                        data: [
                            {
                                value: [
                                    data.avgPlan || 0,
                                    data.avgProblem || 0,
                                    data.avgAction || 0,
                                    data.avgSuccess || 0,
                                    data.avgReview || 0,
                                    data.avgOperation || 0,
                                    data.avgPresentation || 0
                                ],
                                name: '平均分',
                                areaStyle: {
                                    color: 'rgba(102, 126, 234, 0.3)'
                                },
                                lineStyle: {
                                    color: 'rgba(102, 126, 234, 1)',
                                    width: 2
                                },
                                itemStyle: {
                                    color: 'rgba(102, 126, 234, 1)'
                                }
                            }
                        ]
                    }
                ]
            };
            
            chart.setOption(option);
        }
        
        // 响应式处理
        window.addEventListener('resize', () => {
            echarts.getInstanceByDom(document.getElementById('regionChart'))?.resize();
            echarts.getInstanceByDom(document.getElementById('subjectChart'))?.resize();
            echarts.getInstanceByDom(document.getElementById('scoreChart'))?.resize();
        });
    </script>
</body>
</html>
